name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint · test · e2e · build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ranin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ranin_test?schema=public
      JWT_SECRET: ci-jwt-secret-at-least-16-characters
      JWT_EXPIRES_IN: 15m
      REFRESH_JWT_SECRET: ci-refresh-secret-at-least-16-characters
      REFRESH_JWT_EXPIRES_IN: 30d
      CORS_ORIGINS: http://localhost:3000
      PORT: "3333"
      LIARA_ENDPOINT: https://example.com
      LIARA_BUCKET_NAME: ci-bucket
      LIARA_ACCESS_KEY: ci-access-key
      LIARA_SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync database schema
        run: pnpm --filter ./apps/api exec prisma migrate deploy
      - run: pnpm --filter ./apps/api lint
      - run: pnpm --filter ./apps/api test
      - run: pnpm --filter ./apps/api test:e2e
      - run: pnpm --filter ./apps/api build

  web:
    name: Web (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    env:
      # The root workspace install runs the API's Prisma postinstall even in
      # the web job. Prisma only needs this value to load its config while
      # generating the client; no database connection is opened here.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ranin_ci?schema=public
      SESSION_SECRET_KEY: ci-session-secret-at-least-16-characters
      BACKEND_URL: http://localhost:3333/api
      NEXT_PUBLIC_API_URL: http://localhost:3333/api
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/web lint
      - run: pnpm --filter ./apps/web typecheck
      - run: pnpm --filter ./apps/web test
      - run: pnpm --filter ./apps/web build

  docker:
    name: Docker (build images)
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t ranin-api .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t ranin-web .
