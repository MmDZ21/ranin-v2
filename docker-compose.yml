# Local development database for ranin-v2.
# Bring it up with:  docker compose up -d
# Optional DB UI:     docker compose --profile tools up -d   (Adminer on :8080)
#
# Defaults match apps/api/.env.example:
#   DATABASE_URL="postgresql://postgres:postgres@localhost:5432/ranin?schema=public"
services:
  db:
    image: postgres:16-alpine
    container_name: ranin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ranin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ranin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ranin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: ranin-adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ranin_pgdata:
